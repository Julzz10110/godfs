apiVersion: apps/v1
kind: Deployment
metadata:
  name: godfs-chunk
  namespace: godfs
  labels:
    app.kubernetes.io/name: godfs-chunk
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: godfs-chunk
  template:
    metadata:
      labels:
        app.kubernetes.io/name: godfs-chunk
    spec:
      containers:
        - name: chunk
          image: godfs-chunkserver:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 8000
            - name: metrics
              containerPort: 9091
          env:
            - name: GODFS_MASTER
              value: "godfs-master.godfs.svc.cluster.local:9090"
            - name: GODFS_CHUNK_LISTEN
              value: "0.0.0.0:8000"
            - name: GODFS_ADVERTISE_ADDR
              value: "godfs-chunk.godfs.svc.cluster.local:8000"
            - name: GODFS_METRICS_LISTEN
              value: "0.0.0.0:9091"
            - name: GODFS_CHUNK_DATA
              value: "/var/lib/godfs/data"
            # internal client TLS + hot reload.
            - name: GODFS_TLS_RELOAD
              value: "1"
            - name: GODFS_TLS_RELOAD_INTERVAL
              value: "5s"
            - name: GODFS_TLS_ENABLED
              value: "1"
            - name: GODFS_TLS_CA_FILE
              value: "/etc/godfs/tls/ca.crt"
            - name: GODFS_TLS_CLIENT_CERT_FILE
              value: "/etc/godfs/tls/tls.crt"
            - name: GODFS_TLS_CLIENT_KEY_FILE
              value: "/etc/godfs/tls/tls.key"
            - name: GODFS_CLUSTER_KEY
              valueFrom:
                secretKeyRef:
                  name: godfs-auth
                  key: GODFS_CLUSTER_KEY
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /var/lib/godfs
            - name: tls
              mountPath: /etc/godfs/tls
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
        - name: tls
          secret:
            secretName: godfs-tls
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: godfs-chunk
  namespace: godfs
spec:
  selector:
    app.kubernetes.io/name: godfs-chunk
  ports:
    - name: grpc
      port: 8000
      targetPort: grpc
    - name: metrics
      port: 9091
      targetPort: metrics
