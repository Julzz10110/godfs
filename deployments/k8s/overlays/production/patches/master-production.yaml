apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: godfs-master
  namespace: godfs
spec:
  template:
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: godfs-master
                topologyKey: kubernetes.io/hostname
      containers:
        - name: master
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          # Steady-state: do not re-bootstrap; enable bootstrap only for first empty cluster (see K8S_PRODUCTION.md).
          env:
            - name: GODFS_MASTER_BOOTSTRAP
              value: "0"
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 4
