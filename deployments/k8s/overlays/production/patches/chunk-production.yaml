apiVersion: apps/v1
kind: Deployment
metadata:
  name: godfs-chunk
  namespace: godfs
spec:
  template:
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: godfs-chunk
                topologyKey: kubernetes.io/hostname
      containers:
        - name: chunk
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 8Gi
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 4
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: godfs-chunk-data
        - name: tls
          secret:
            secretName: godfs-tls
            optional: true
