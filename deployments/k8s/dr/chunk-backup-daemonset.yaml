apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: godfs-chunk-backup
spec:
  selector:
    matchLabels:
      app: godfs-chunk-backup
  template:
    metadata:
      labels:
        app: godfs-chunk-backup
    spec:
      restartPolicy: Always
      containers:
        - name: backup
          image: godfs-client:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: GODFS_BACKUP_DIR
              value: "/backup"
            - name: GODFS_CHUNK_DATA_DIR
              value: "/chunkdata"
          volumeMounts:
            - name: chunkdata
              mountPath: /chunkdata
            - name: backup
              mountPath: /backup
          command:
            - /bin/sh
            - -ec
            - |
              ts="$(date -u +%Y%m%dT%H%M%SZ)"
              out="${GODFS_BACKUP_DIR}/chunks-${NODE_NAME}-${ts}"
              mkdir -p "${out}"
              /usr/local/bin/chunkctl backup --data-dir "${GODFS_CHUNK_DATA_DIR}" --out "${out}" --concurrency 2
              echo "backup complete: ${out}"
              # keep container alive (DaemonSet pattern)
              sleep 3600
      volumes:
        - name: chunkdata
          hostPath:
            path: /var/lib/godfs/chunkdata
            type: DirectoryOrCreate
        - name: backup
          persistentVolumeClaim:
            claimName: godfs-backup-pvc

