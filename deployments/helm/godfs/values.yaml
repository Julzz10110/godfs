namespace: godfs

images:
  master: godfs-master:latest
  chunk: godfs-chunkserver:latest
  restgateway: godfs-restgateway:latest

replicas:
  chunk: 1
  restgateway: 1

raft:
  enabled: true
  replicas: 5
  # Set to false after the first successful cluster bootstrap (persisted Raft on PVCs).
  bootstrap: true
  raftDir: /var/lib/godfs/raft
  storage:
    size: 1Gi
    accessModes: ["ReadWriteOnce"]

metrics:
  enabled: true
  listen: "0.0.0.0:9091"

# Prometheus Operator (kube-prometheus-stack): rules, ServiceMonitors, tunable SLO thresholds.
# Plain manifests: deployments/observability/ (synced from Helm defaults via scripts/sync_observability_rules.sh).
prometheus:
  operator:
    enabled: false
  rules:
    enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
  dataplane:
    pendingDeletesThreshold: 1000
    rebalanceQueueThreshold: 200
  slo:
    # Tune per cluster; lab compose should stay well below these.
    grpcUnaryP99MaxSeconds: 2
    prepareWriteP99Seconds: 1
    restP95Seconds: 5
    rest5xxRate: 0.05
    latencyAlertFor: 10m
    errorRateAlertFor: 5m

tls:
  enabled: true
  reload: true
  reloadInterval: 5s
  mountPath: /etc/godfs/tls
  secretName: godfs-tls

auth:
  secretName: godfs-auth
  clusterKeyKey: GODFS_CLUSTER_KEY
  apiKeysKey: GODFS_API_KEYS
  rbacJSONKey: GODFS_RBAC_JSON

master:
  grpcPort: 9090
  raftPort: 9200

chunk:
  grpcPort: 8000
  dataDir: /var/lib/godfs/data

restgateway:
  httpPort: 8080

