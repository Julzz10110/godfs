apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-restgateway
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "godfs.labels" . | nindent 4 }}
    app.kubernetes.io/component: restgateway
spec:
  replicas: {{ .Values.replicas.restgateway }}
  selector:
    matchLabels:
      {{- include "godfs.labels" . | nindent 6 }}
      app.kubernetes.io/component: restgateway
  template:
    metadata:
      labels:
        {{- include "godfs.labels" . | nindent 8 }}
        app.kubernetes.io/component: restgateway
    spec:
      {{- if .Values.tls.enabled }}
      volumes:
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
            optional: true
      {{- end }}
      containers:
        - name: restgateway
          image: {{ .Values.images.restgateway }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.restgateway.httpPort }}
            - name: metrics
              containerPort: 9091
          env:
            - name: GODFS_MASTER
              value: "{{ .Release.Name }}-master.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.master.grpcPort }}"
            - name: GODFS_REST_LISTEN
              value: "0.0.0.0:{{ .Values.restgateway.httpPort }}"
            - name: GODFS_METRICS_LISTEN
              value: {{ .Values.metrics.listen | quote }}
            {{- if .Values.tls.enabled }}
            - name: GODFS_TLS_ENABLED
              value: "1"
            - name: GODFS_TLS_CA_FILE
              value: "{{ .Values.tls.mountPath }}/ca.crt"
            - name: GODFS_TLS_CLIENT_CERT_FILE
              value: "{{ .Values.tls.mountPath }}/tls.crt"
            - name: GODFS_TLS_CLIENT_KEY_FILE
              value: "{{ .Values.tls.mountPath }}/tls.key"
            - name: GODFS_TLS_RELOAD
              value: {{ ternary "1" "0" .Values.tls.reload | quote }}
            - name: GODFS_TLS_RELOAD_INTERVAL
              value: {{ .Values.tls.reloadInterval | quote }}
            {{- end }}
          {{- if .Values.tls.enabled }}
          volumeMounts:
            - name: tls
              mountPath: {{ .Values.tls.mountPath }}
              readOnly: true
          {{- end }}
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-restgateway
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "godfs.labels" . | nindent 4 }}
    app.kubernetes.io/component: restgateway
spec:
  selector:
    {{- include "godfs.labels" . | nindent 4 }}
    app.kubernetes.io/component: restgateway
  ports:
    - name: http
      port: {{ .Values.restgateway.httpPort }}
      targetPort: http
    - name: metrics
      port: 9091
      targetPort: metrics

