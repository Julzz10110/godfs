apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-chunk
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "godfs.labels" . | nindent 4 }}
    app.kubernetes.io/component: chunk
spec:
  replicas: {{ .Values.replicas.chunk }}
  selector:
    matchLabels:
      {{- include "godfs.labels" . | nindent 6 }}
      app.kubernetes.io/component: chunk
  template:
    metadata:
      labels:
        {{- include "godfs.labels" . | nindent 8 }}
        app.kubernetes.io/component: chunk
    spec:
      {{- if .Values.tls.enabled }}
      volumes:
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
            optional: true
      {{- end }}
      containers:
        - name: chunk
          image: {{ .Values.images.chunk }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: {{ .Values.chunk.grpcPort }}
            - name: metrics
              containerPort: 9091
          env:
            - name: GODFS_MASTER
              value: "{{ .Release.Name }}-master.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.master.grpcPort }}"
            - name: GODFS_CHUNK_LISTEN
              value: "0.0.0.0:{{ .Values.chunk.grpcPort }}"
            - name: GODFS_ADVERTISE_ADDR
              value: "{{ .Release.Name }}-chunk.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.chunk.grpcPort }}"
            - name: GODFS_METRICS_LISTEN
              value: {{ .Values.metrics.listen | quote }}
            - name: GODFS_CHUNK_DATA
              value: {{ .Values.chunk.dataDir | quote }}
            - name: GODFS_CLUSTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.secretName }}
                  key: {{ .Values.auth.clusterKeyKey }}
                  optional: true
            {{- if .Values.tls.enabled }}
            - name: GODFS_TLS_ENABLED
              value: "1"
            - name: GODFS_TLS_CA_FILE
              value: "{{ .Values.tls.mountPath }}/ca.crt"
            - name: GODFS_TLS_CLIENT_CERT_FILE
              value: "{{ .Values.tls.mountPath }}/tls.crt"
            - name: GODFS_TLS_CLIENT_KEY_FILE
              value: "{{ .Values.tls.mountPath }}/tls.key"
            - name: GODFS_TLS_RELOAD
              value: {{ ternary "1" "0" .Values.tls.reload | quote }}
            - name: GODFS_TLS_RELOAD_INTERVAL
              value: {{ .Values.tls.reloadInterval | quote }}
            {{- end }}
          {{- if .Values.tls.enabled }}
          volumeMounts:
            - name: tls
              mountPath: {{ .Values.tls.mountPath }}
              readOnly: true
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-chunk
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "godfs.labels" . | nindent 4 }}
    app.kubernetes.io/component: chunk
spec:
  selector:
    {{- include "godfs.labels" . | nindent 4 }}
    app.kubernetes.io/component: chunk
  ports:
    - name: grpc
      port: {{ .Values.chunk.grpcPort }}
      targetPort: grpc
    - name: metrics
      port: 9091
      targetPort: metrics

