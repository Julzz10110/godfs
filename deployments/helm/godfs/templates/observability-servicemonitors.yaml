      {{- include "godfs.labels" . | nindent 6 }}
      app.kubernetes.io/component: chunk
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.prometheus.serviceMonitor.interval }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
