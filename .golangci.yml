# https://golangci-lint.run/docs/configuration/file/
version: "2"

run:
  timeout: 8m
  tests: true

formatters:
  enable:
    - gofumpt

linters:
  default: none
  enable:
    - copyloopvar
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  settings:
    errcheck:
      check-type-assertions: false
      # Defer Close() is intentional fire-and-forget on shutdown paths.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (io.ReadCloser).Close
  exclusions:
    rules:
      - path: '^api/proto/'
        linters:
          - staticcheck
          - unused
