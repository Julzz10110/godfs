# https://golangci-lint.run/docs/configuration/file/
version: "2"

run:
  timeout: 8m
  tests: true

formatters:
  enable:
    - gofumpt

linters:
  default: none
  enable:
    - copyloopvar
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  settings:
    errcheck:
      check-type-assertions: false
  exclusions:
    rules:
      - path: '^api/proto/'
        linters:
          - staticcheck
          - unused
