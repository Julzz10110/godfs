name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install helm
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: observability gate (promtool, helm template, rules sync)
        run: bash scripts/observability_check.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install golangci-lint (match go.mod toolchain)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.1

      - name: golangci-lint
        run: golangci-lint run --timeout=8m

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test (all packages except e2e)
        run: |
          set -e
          mapfile -t pkgs < <(go list ./... | grep -v '^godfs/test/e2e$' || true)
          if [ "${#pkgs[@]}" -eq 0 ]; then echo "no packages"; exit 1; fi
          go test "${pkgs[@]}" -count=1 -timeout 10m

      - name: E2E (incl. Raft failover)
        run: go test ./test/e2e -count=1 -timeout=15m -v

      - name: Build FUSE (Linux)
        run: go build -o /tmp/godfs-fuse ./cmd/fuse

      - name: Client micro-benchmark gate (ns/op)
        run: bash scripts/bench_gate.sh

  rest-compose:
    runs-on: ubuntu-latest
    env:
      GODFS_DOCKER_COMPOSE_EXTRA: deployments/docker/docker-compose.toxiproxy.yml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and start stack (with Toxiproxy overlay)
        run: docker compose -f deployments/docker/docker-compose.yml -f deployments/docker/docker-compose.toxiproxy.yml up -d --build

      - name: REST smoke (curl, direct port)
        run: bash scripts/rest_compose_smoke.sh

      - name: REST smoke via Toxiproxy (latency gate)
        run: bash scripts/toxiproxy_rest_gate.sh

      - name: Integration tests (REST)
        run: go test ./test/integration -tags=integration -count=1 -timeout=5m -v

      - name: Chaos smoke (chunk restart)
        run: bash scripts/compose_chaos_smoke.sh

      - name: Netem gate (chunk latency)
        run: bash scripts/compose_netem_gate.sh

      - name: Tear down
        if: always()
        run: docker compose -f deployments/docker/docker-compose.yml -f deployments/docker/docker-compose.toxiproxy.yml down -v

  raft-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build godfs-client for compose scripts
        run: go build -o bin/godfs-client ./cmd/client

      - name: Build and start Raft masters
        run: docker compose -f deployments/docker/docker-compose.raft.yml up -d --build master-0 master-1 master-2

      - name: Verify Raft masters are running
        run: |
          set -euo pipefail
          docker compose -f deployments/docker/docker-compose.raft.yml ps -a
          for s in master-0 master-1 master-2; do
            if ! docker compose -f deployments/docker/docker-compose.raft.yml ps --status running -q "$s" | grep -q .; then
              echo "service $s not running; logs:" >&2
              docker compose -f deployments/docker/docker-compose.raft.yml logs --no-color --tail=120 "$s" >&2 || true
              exit 1
            fi
          done

      - name: Start chunk and REST after masters are up
        run: docker compose -f deployments/docker/docker-compose.raft.yml up -d chunk rest

      - name: Bootstrap Raft cluster (single-node then join)
        run: bash scripts/raft_compose_bootstrap.sh

      - name: Raft quorum break
        env:
          GODFS_RAFT_CHAOS_QUORUM_BREAK: "1"
        run: bash scripts/compose_raft_leader_chaos.sh

      - name: Restart stack after quorum test
        run: |
          docker compose -f deployments/docker/docker-compose.raft.yml down -v
          docker compose -f deployments/docker/docker-compose.raft.yml up -d --build master-0 master-1 master-2
          docker compose -f deployments/docker/docker-compose.raft.yml up -d chunk rest
          bash scripts/raft_compose_bootstrap.sh

      - name: Raft leader kill chaos
        run: bash scripts/compose_raft_leader_chaos.sh

      - name: Tear down
        if: always()
        run: docker compose -f deployments/docker/docker-compose.raft.yml down -v

  testcontainers:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install helm
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Submodule smoke (optional module)
        env:
          GODFS_TESTCONTAINERS: "1"
        run: |
          cd test/containers
          go test ./... -count=1 -v
